<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${purchaseId == null} ? '買った' : '記録を直す')}"></head>
<body>
<div class="app">

  <!-- 登録のときは「買った」、編集のときは「記録の編集」に色が付く -->
  <nav th:replace="~{fragments/layout :: sidebar(${purchaseId == null} ? 'purchase-new' : 'purchases')}"></nav>

  <main class="main">

    <div class="page-header">
      <div>
        <h1 th:text="${purchaseId == null} ? '買った' : '記録を直す'">買った</h1>
        <p class="page-header__sub"
           th:text="${purchaseId == null} ? '買ったものを1回分ずつ記録します' : '入力ミスを直します'">買ったものを1回分ずつ記録します</p>
      </div>
    </div>

    <!-- purchaseId があれば編集（POST /purchases/{id}）、なければ登録（POST /purchases） -->
    <form class="card form"
          th:action="${purchaseId == null} ? @{/purchases} : @{/purchases/{id}(id=${purchaseId})}"
          th:object="${purchaseForm}" method="post">

      <!-- 入力欄ごとのエラーがあるときだけ、上にまとめて案内を出す -->
      <p class="error-box" th:if="${#fields.hasErrors('*')}">
        入力内容に直すところがあります。各項目の下の赤い文字を確認してください。
      </p>
      <!-- 在庫のルールで断られたときのエラー（特定の入力欄に結びつかないもの） -->
      <p class="error-box" th:each="err : ${#fields.globalErrors()}" th:text="${err}">数量は 1 本より少なくできません</p>

      <div class="field">
        <label for="name">品目名</label>
        <input type="text" th:field="*{name}" placeholder="牛乳 など">
        <p class="field__error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="quantity">数量</label>
          <input type="number" step="0.01" th:field="*{quantity}">
          <p class="field__hint">0.5 のような小数も入力できます</p>
          <p class="field__error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></p>
        </div>
        <div class="field">
          <label for="unit">単位</label>
          <input type="text" th:field="*{unit}" placeholder="個・本・g など">
          <p class="field__error" th:if="${#fields.hasErrors('unit')}" th:errors="*{unit}"></p>
        </div>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="category">カテゴリ</label>
          <input type="text" th:field="*{category}" placeholder="野菜・肉・魚 など">
          <p class="field__error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></p>
        </div>
        <div class="field">
          <label for="storageType">保存方法</label>
          <select th:field="*{storageType}">
            <option value="">選択してください</option>
            <option th:each="st : ${storageTypes}" th:value="${st}" th:text="${st.label}">冷蔵</option>
          </select>
          <p class="field__error" th:if="${#fields.hasErrors('storageType')}" th:errors="*{storageType}"></p>
        </div>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="expiryDate">消費期限 <span class="field__optional">(任意)</span></label>
          <input type="date" th:field="*{expiryDate}">
          <p class="field__hint">調味料など期限がないものは空欄のままで大丈夫です</p>
        </div>
        <div class="field">
          <label for="purchasedDate">購入日</label>
          <input type="date" th:field="*{purchasedDate}">
          <p class="field__error" th:if="${#fields.hasErrors('purchasedDate')}" th:errors="*{purchasedDate}"></p>
        </div>
      </div>

      <div class="field">
        <label for="note">備考 <span class="field__optional">(任意)</span></label>
        <input type="text" th:field="*{note}">
        <p class="field__error" th:if="${#fields.hasErrors('note')}" th:errors="*{note}"></p>
      </div>

      <div class="form-actions">
        <a class="btn btn--ghost" th:if="${purchaseId == null}" th:href="@{/purchases}">一覧へ戻る</a>
        <a class="btn btn--ghost" th:unless="${purchaseId == null}" th:href="@{/purchases/{id}(id=${purchaseId})}">詳細へ戻る</a>
        <button class="btn btn--primary" type="submit" th:text="${purchaseId == null} ? '記録する' : '変更する'">記録する</button>
      </div>
    </form>

  </main>
</div>
</body>
</html>
