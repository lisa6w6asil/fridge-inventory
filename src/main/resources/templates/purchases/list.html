<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('買った記録')}"></head>
<body>
<div class="app">

  <!-- 'purchases' を渡すと「買った記録」に色が付く -->
  <nav th:replace="~{fragments/layout :: sidebar('purchases')}"></nav>

  <main class="main">

    <div class="page-header">
      <div>
        <h1>買った記録</h1>
        <p class="page-header__sub">購入日の新しい順</p>
      </div>
      <div class="page-header__actions">
        <a class="btn btn--buy" th:href="@{/purchases/new}">＋ 買った</a>
      </div>
    </div>

    <!-- 削除のあとに、結果のメッセージを出す -->
    <p class="card" th:if="${message}" th:text="${message}">削除しました</p>
    <p class="error-box" th:if="${errorMessage}" th:text="${errorMessage}">削除できません</p>

    <p class="card empty" th:if="${#lists.isEmpty(purchases)}">
      まだ記録がありません。「＋ 買った」から登録できます。
    </p>

    <!-- PurchaseController が "purchases" という名前で渡している一覧を表にする -->
    <section class="card" th:unless="${#lists.isEmpty(purchases)}">
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>購入日</th>
              <th>品目名</th>
              <th>数量</th>
              <th>カテゴリ</th>
              <th>保存方法</th>
              <th>消費期限</th>
              <th>備考</th>
              <th class="col-actions"></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="p : ${purchases}">
              <td th:text="${#temporals.format(p.purchasedDate, 'yyyy/M/d')}">2026/10/26</td>
              <td><strong th:text="${p.name}">牛乳</strong></td>
              <td class="num" th:text="${p.quantityDisplay + ' ' + p.unit}">2 本</td>
              <td th:text="${p.category}">乳製品</td>
              <td th:text="${p.storageType.label}">冷蔵</td>
              <td th:text="${p.expiryDate != null ? #temporals.format(p.expiryDate, 'yyyy/M/d') : '期限なし'}">2026/10/27</td>
              <td th:text="${p.note} ?: ''"></td>
              <td class="col-actions">
                <form th:action="@{/purchases/{id}/delete(id=${p.id})}" method="post"
                      onsubmit="return confirm('この記録を削除しますか？');">
                  <button class="btn btn--ghost" type="submit">削除</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>
</div>
</body>
</html>
