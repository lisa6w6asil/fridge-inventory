<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('記録の編集')}"></head>
<body>
<div class="app">

  <!-- 'purchases' を渡すと「買った記録」に色が付く -->
  <nav th:replace="~{fragments/layout :: sidebar('purchases')}"></nav>

  <main class="main">

    <div class="page-header">
      <div>
        <h1>記録の編集</h1>
        <p class="page-header__sub">購入日の新しい順・行を押すと詳細を開きます</p>
      </div>
      <div class="page-header__actions">
        <a class="btn btn--buy" th:href="@{/purchases/new}">＋ 買った</a>
      </div>
    </div>

    <!-- 削除などのあとに、結果のメッセージを出す -->
    <p class="card" th:if="${message}" th:text="${message}">削除しました</p>
    <p class="error-box" th:if="${errorMessage}" th:text="${errorMessage}">見つかりません</p>

    <p class="card empty" th:if="${#lists.isEmpty(purchases)}">
      まだ記録がありません。「＋ 買った」から登録できます。
    </p>

    <section class="card" th:unless="${#lists.isEmpty(purchases)}">
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>購入日</th>
              <th>品目名</th>
              <th>数量</th>
              <th>カテゴリ</th>
              <th>保存方法</th>
              <th>消費期限</th>
              <th>備考</th>
            </tr>
          </thead>
          <tbody>
            <!-- data-href に詳細画面のURLを入れておき、下のscriptで行全体を押せるようにする -->
            <tr th:each="p : ${purchases}" th:data-href="@{/purchases/{id}(id=${p.id})}">
              <td th:text="${#temporals.format(p.purchasedDate, 'yyyy/M/d')}">2026/10/26</td>
              <!-- 品目名は本物のリンクにして、キーボード操作や新しいタブでも開けるようにする -->
              <td><a class="table__link" th:href="@{/purchases/{id}(id=${p.id})}"><strong th:text="${p.name}">牛乳</strong></a></td>
              <td class="num" th:text="${p.quantityDisplay + ' ' + p.unit}">2 本</td>
              <td th:text="${p.category}">乳製品</td>
              <td th:text="${p.storageType.label}">冷蔵</td>
              <td th:text="${p.expiryDate != null ? #temporals.format(p.expiryDate, 'yyyy/M/d') : '期限なし'}">2026/10/27</td>
              <td th:text="${p.note} ?: ''"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>
</div>

<script>
  // 行のどこを押しても詳細画面へ移る（品目名のリンクを押したときは、リンク自身に任せる）
  document.querySelectorAll('tr[data-href]').forEach(function (row) {
    row.addEventListener('click', function (event) {
      if (event.target.closest('a')) {
        return;
      }
      location.href = row.dataset.href;
    });
  });
</script>
</body>
</html>
