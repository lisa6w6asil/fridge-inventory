<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>買った記録</title>
</head>
<body>
<h1>買った記録</h1>

<p><a th:href="@{/purchases/new}">＋ 買ったものを追加</a></p>

<p th:if="${#lists.isEmpty(purchases)}">まだ記録がありません。</p>

<table th:unless="${#lists.isEmpty(purchases)}" border="1">
    <thead>
    <tr>
        <th>品目名</th>
        <th>数量</th>
        <th>カテゴリ</th>
        <th>保存方法</th>
        <th>消費期限</th>
        <th>購入日</th>
        <th>備考</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${purchases}">
        <td th:text="${p.name}"></td>
        <td th:text="${p.quantityDisplay + ' ' + p.unit}"></td>
        <td th:text="${p.category}"></td>
        <td th:text="${p.storageType.label}"></td>
        <td th:text="${p.expiryDate != null ? p.expiryDate : '―'}"></td>
        <td th:text="${p.purchasedDate}"></td>
        <td th:text="${p.note}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
