<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>使った</title>
</head>
<body>
<h1>使った</h1>

<p th:if="${#lists.isEmpty(stocks)}">在庫がありません。先に「買った」から登録してください。</p>

<form th:action="@{/usages}" th:object="${usageForm}" method="post">

    <div>
        <label>使ったもの</label>
        <select th:field="*{stockId}">
            <option value="">選択してください</option>
            <option th:each="s : ${stocks}" th:value="${s.stockId()}" th:text="${s.label()}"></option>
        </select>
        <span th:if="${#fields.hasErrors('stockId')}" th:errors="*{stockId}" style="color:red"></span>
    </div>

    <div>
        <label>数量</label>
        <input type="number" step="0.01" th:field="*{quantity}">
        <span th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}" style="color:red"></span>
    </div>

    <div>
        <label>使った日</label>
        <input type="date" th:field="*{usedDate}">
        <span th:if="${#fields.hasErrors('usedDate')}" th:errors="*{usedDate}" style="color:red"></span>
    </div>

    <div>
        <label>何に</label>
        <input type="text" th:field="*{purpose}" placeholder="カレー など">
        <span th:if="${#fields.hasErrors('purpose')}" th:errors="*{purpose}" style="color:red"></span>
    </div>

    <div>
        <label>備考</label>
        <input type="text" th:field="*{note}">
        <span th:if="${#fields.hasErrors('note')}" th:errors="*{note}" style="color:red"></span>
    </div>

    <button type="submit">追加</button>
</form>

<p><a th:href="@{/}">トップへ</a></p>
</body>
</html>
