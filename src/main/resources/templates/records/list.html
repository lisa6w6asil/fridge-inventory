<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('記録の編集')}"></head>
<body>
<div class="app">

  <nav th:replace="~{fragments/layout :: sidebar('purchases')}"></nav>

  <main class="main">

    <div class="page-header">
      <div>
        <h1>記録の編集</h1>
        <p class="page-header__sub">入力ミスの修正・削除はここから。行を押すと詳細を開きます</p>
      </div>
    </div>

    <p class="card" th:if="${message}" th:text="${message}">削除しました</p>
    <p class="error-box" th:if="${errorMessage}" th:text="${errorMessage}">見つかりません</p>

    <p class="card empty" th:if="${#lists.isEmpty(records)}">
      まだ記録がありません。「買った」から登録できます。
    </p>

    <section class="card" th:unless="${#lists.isEmpty(records)}">
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>日付</th>
              <th>種類</th>
              <th>品目名</th>
              <th>数量</th>
              <th>保存方法</th>
              <th>消費期限</th>
              <th>メモ</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="r : ${records}" th:data-href="@{${r.detailPath()}}">
              <td th:text="${#temporals.format(r.date(), 'yyyy/M/d')}">2026/11/13</td>
              <td>
                <span class="badge" th:classappend="${r.isPurchase()} ? 'badge--buy' : 'badge--use'"
                      th:text="${r.typeLabel()}">買った</span>
              </td>
              <td><a class="table__link" th:href="@{${r.detailPath()}}"><strong th:text="${r.name()}">にんじん</strong></a></td>
              <td class="num" th:text="${r.quantityDisplay() + ' ' + r.unit()}">+3 本</td>
              <td th:text="${r.storageType().label}">冷蔵</td>
              <td th:text="${r.expiryDate() != null ? #temporals.format(r.expiryDate(), 'yyyy/M/d') : '期限なし'}">2026/11/20</td>
              <td th:text="${r.memo()}">野菜</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>
</div>

<script>
  // 行のどこを押しても詳細画面へ移る（品目名のリンクを押したときは、リンク自身に任せる）
  document.querySelectorAll('tr[data-href]').forEach(function (row) {
    row.addEventListener('click', function (event) {
      if (event.target.closest('a')) {
        return;
      }
      location.href = row.dataset.href;
    });
  });
</script>
</body>
</html>
